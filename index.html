<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Sujan Das — Groceries Delivered Fast</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --pink:#ff1764;
  --purple:#711cff;
  --dark:#17131d;
  --muted:#77727c;
  --soft:#f7f6f9;
  --white:#fff;
  --border:#e8e5eb;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f4f7;
  color:var(--dark);
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:white;
  overflow:hidden;
  position:relative;
}

/* SCREEN SYSTEM */

.screen{
  display:none;
  min-height:100vh;
  background:#fff;
}

.screen.active{
  display:block;
}

/* ONBOARDING */

.onboarding{
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.hero-art{
  height:52vh;
  min-height:360px;
  background:
  radial-gradient(circle at 15% 20%,#fff 0 7%,transparent 8%),
  radial-gradient(circle at 80% 25%,#fff 0 6%,transparent 7%),
  linear-gradient(145deg,#ead7ff,#caa6ff 55%,#a76bff);
  position:relative;
  overflow:hidden;
  border-radius:0 0 28px 28px;
}

.cloud{
  position:absolute;
  background:#fff;
  opacity:.75;
  border-radius:100px;
  filter:blur(1px);
}

.cloud.one{
  width:180px;
  height:55px;
  top:55px;
  left:-35px;
}

.cloud.two{
  width:210px;
  height:65px;
  top:115px;
  right:-65px;
}

.cloud.three{
  width:160px;
  height:48px;
  bottom:70px;
  left:-40px;
}

.delivery-box{
  position:absolute;
  width:235px;
  height:145px;
  background:#c78b55;
  border-radius:10px;
  left:50%;
  bottom:65px;
  transform:translateX(-50%);
  box-shadow:0 18px 35px #71408c44;
}

.delivery-box:before{
  content:"SUJAN DAS";
  position:absolute;
  left:0;
  right:0;
  top:47px;
  text-align:center;
  color:#fff;
  font-size:25px;
  font-weight:800;
  letter-spacing:1px;
}

.bag-handle{
  position:absolute;
  width:105px;
  height:70px;
  border:7px solid #724322;
  border-bottom:0;
  border-radius:80px 80px 0 0;
  left:65px;
  top:-50px;
}

.product{
  position:absolute;
  bottom:165px;
  width:65px;
  height:85px;
  border-radius:12px;
}

.product.a{
  left:calc(50% - 105px);
  background:#78b9dd;
  transform:rotate(-10deg);
}

.product.b{
  left:calc(50% - 30px);
  background:#ef4f59;
  height:75px;
  transform:rotate(7deg);
}

.product.c{
  left:calc(50% + 48px);
  background:#76b66b;
  height:92px;
  transform:rotate(12deg);
}

.spark{
  position:absolute;
  color:white;
  font-size:30px;
  font-weight:900;
}

.spark.s1{top:130px;left:75px}
.spark.s2{top:165px;right:80px}
.spark.s3{top:245px;left:45px}

.skip{
  position:absolute;
  right:18px;
  top:20px;
  padding:11px 18px;
  border-radius:22px;
  background:#fff;
  color:#721b77;
  font-weight:700;
  box-shadow:0 5px 20px #00000018;
}

.onboard-content{
  padding:27px 24px 32px;
}

.onboard-content h1{
  font-size:29px;
  line-height:1.15;
  margin-bottom:24px;
  letter-spacing:-.6px;
}

.gradient-text{
  color:var(--purple);
}

.phone-box{
  height:62px;
  border:1.5px solid #ddd9e1;
  border-radius:17px;
  display:flex;
  align-items:center;
  padding:0 17px;
  gap:13px;
  margin-bottom:14px;
  background:#fff;
}

.country{
  font-weight:700;
  color:#343039;
}

.phone-box input{
  border:0;
  outline:0;
  width:100%;
  font-size:17px;
}

.phone-box input::placeholder{
  color:#a4a0a8;
}

.primary{
  width:100%;
  height:60px;
  border-radius:17px;
  background:var(--pink);
  color:#fff;
  font-weight:800;
  font-size:17px;
  transition:.2s;
}

.primary:active{
  transform:scale(.98);
}

.terms{
  text-align:center;
  color:#88838d;
  font-size:12px;
  line-height:1.5;
  margin-top:17px;
}

/* LOGIN SHEET */

.overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  display:none;
  align-items:flex-end;
}

.overlay.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:28px 24px 30px;
  animation:up .3s ease;
}

@keyframes up{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheet-user{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb4d0,#ff2d72);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:27px;
  font-weight:800;
}

.sheet-user h2{
  font-size:24px;
  margin-bottom:5px;
}

.sheet-user p{
  color:#77727d;
  font-size:15px;
}

.language{
  margin-left:auto;
  border:1px solid #ddd9e0;
  padding:12px 15px;
  border-radius:14px;
  background:#fff;
}

.continue{
  height:62px;
  border-radius:18px;
  background:var(--pink);
  color:#fff;
  font-weight:800;
  width:100%;
  font-size:16px;
  margin-bottom:24px;
}

.other{
  text-align:center;
  font-weight:700;
  color:#66616a;
  margin-bottom:28px;
}

.legal{
  border-top:1px solid #eee;
  padding-top:20px;
  color:#8b8790;
  line-height:1.5;
  font-size:12px;
}

@media(max-width:380px){
  .onboard-content h1{
    font-size:26px;
  }

  .hero-art{
    min-height:330px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ONBOARDING -->

  <section class="screen active" id="welcome">

    <div class="onboarding">

      <div class="hero-art">

        <button class="skip"
        onclick="openHome()">Skip</button>

        <div class="cloud one"></div>
        <div class="cloud two"></div>
        <div class="cloud three"></div>

        <div class="spark s1">✦</div>
        <div class="spark s2">✧</div>
        <div class="spark s3">✦</div>

        <div class="product a"></div>
        <div class="product b"></div>
        <div class="product c"></div>

        <div class="delivery-box">
          <div class="bag-handle"></div>
        </div>

      </div>

      <div class="onboard-content">

        <h1>
          Groceries delivered in
          <span class="gradient-text">minutes</span>
        </h1>

        <div class="phone-box">

          <span class="country">+91</span>

          <input
            id="phone"
            type="tel"
            maxlength="10"
            placeholder="Enter Phone Number"
          >

        </div>

        <button
          class="primary"
          onclick="loginStart()"
        >
          Continue
        </button>

        <div class="terms">
          By continuing, you agree to our
          Terms of Service and Privacy Policy.
        </div>

      </div>

    </div>

  </section>

</div>


<!-- LOGIN BOTTOM SHEET -->

<div class="overlay" id="loginOverlay">

  <div class="sheet">

    <div class="sheet-user">

      <div class="avatar">S</div>

      <div>
        <h2>Login to Sujan Das</h2>
        <p id="loginPhone">+91</p>
      </div>

      <button class="language">🌐 EN</button>

    </div>

    <button
      class="continue"
      onclick="completeLogin()"
    >
      CONTINUE
    </button>

    <div
      class="other"
      onclick="closeLogin()"
    >
      USE ANOTHER METHOD
    </div>

    <div class="legal">
      By continuing you accept our privacy policy
      and terms of service.
    </div>

  </div>

</div>


<script>

function loginStart(){

  const phone =
    document.getElementById("phone").value.trim();

  if(phone.length !== 10){

    alert("Please enter a valid 10-digit mobile number.");

    return;
  }

  document.getElementById("loginPhone").innerText =
    "+91 " + phone;

  document
    .getElementById("loginOverlay")
    .classList.add("show");
}


function closeLogin(){

  document
    .getElementById("loginOverlay")
    .classList.remove("show");
}


function completeLogin(){

  closeLogin();

  setTimeout(function(){

    alert("Login successful!");

    openHome();

  },250);

}


function openHome(){

  alert("Sujan Das shopping experience starts here.");

}

</script>

</body>
  </html>
